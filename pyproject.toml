[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arraylib"
version = "1.0.0"
description = "Direction-of-arrival estimation for UAV rotor noise with a 4x4 microphone array"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Radu Coman" }]
keywords = ["acoustics", "beamforming", "direction-of-arrival", "MUSIC",
            "ESPRIT", "GCC-PHAT", "microphone-array", "UAV"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
# Live capture needs the PortAudio system library as well:
#   sudo apt install libportaudio2
realtime = ["sounddevice>=0.4.6"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
